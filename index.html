*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#board,#board *{touch-action:none}
html,body{height:100%;background:#0d0d0f;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;font-family:-apple-system,"Hiragino Sans",sans-serif;color:#eee}
#board{position:fixed;inset:0;display:grid;gap:6px;
  padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
.panel{border-radius:14px;display:flex;flex-direction:column;overflow:hidden;position:relative;min-width:0;min-height:0}
.name{flex:0 0 auto;display:flex;align-items:center;gap:.5em;padding:0 .6em;white-space:nowrap;overflow:hidden;line-height:1}
.name .t{overflow:hidden;text-overflow:ellipsis}
.delta{font-variant-numeric:tabular-nums;opacity:0;transition:opacity .35s}
.delta.show{opacity:.85;transition:none}
.digits{flex:1;display:flex;align-items:stretch;min-height:0;padding:0 2%}
.sign,.digit{display:flex;align-items:center;justify-content:center;line-height:1;font-variant-numeric:tabular-nums lining-nums;position:relative}
.digit{flex:1 1 0;min-width:0}
.sign{flex:0 0 auto}
.ch{pointer-events:none;position:relative;z-index:1}
.lead .ch{opacity:.16}
/* マイナスを赤く（オプション） */
#board.negred .isneg{color:#ff1f1f!important}
/* サブポイント */
.sub{position:relative;z-index:5;flex:0 0 auto;margin:0 2% 2%;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;line-height:1;font-variant-numeric:tabular-nums lining-nums;overflow:hidden}
.sub .sv{position:relative;z-index:1;white-space:nowrap;text-shadow:0 0 .03em rgba(0,0,0,.55),0 .02em .09em rgba(0,0,0,.5),0 0 .18em rgba(0,0,0,.25)}
.sub .sm,.sub .sp{position:absolute;top:50%;transform:translateY(-50%);color:#000;opacity:.2;font-size:.45em;font-family:-apple-system,sans-serif;z-index:1}
.sub .sm{left:.5em}.sub .sp{right:.5em}
.se{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-weight:400}
.ei{position:relative;display:inline-block;line-height:1}
.ei b{position:absolute;right:-.15em;bottom:-.1em;color:#fff;font-family:-apple-system,"Hiragino Sans",sans-serif;font-weight:800;line-height:1;
 text-shadow:0 0 .05em #000,0 0 .1em rgba(0,0,0,.85),0 .03em .16em rgba(0,0,0,.7),0 0 .3em rgba(0,0,0,.35)}
.emo i{font-style:normal;font-size:24px;cursor:pointer;padding:2px 4px}
.sh{position:absolute;top:0;bottom:0;width:50%;z-index:2}.sh.sl{left:0}.sh.sr{right:0}
.sh::after{content:"";position:absolute;inset:0;background:#000;opacity:0;transition:opacity .25s}
.sh.flash::after{opacity:.1;transition:none}
/* 白い数字に影をつけて読みやすく（全プレイヤー共通） */
.shadownum .ch,.rval.shadownum{text-shadow:0 0 .03em rgba(0,0,0,.55),0 .02em .09em rgba(0,0,0,.5),0 0 .18em rgba(0,0,0,.25)}
.lightbg .lead .ch{opacity:.35}
#board.lines .digit+.digit::before{content:"";position:absolute;left:0;top:6%;bottom:6%;width:1px;background:currentColor;opacity:.1}
#board.lines .digit::after{content:"";position:absolute;left:4%;right:4%;top:50%;height:1px;background:currentColor;opacity:.1;z-index:2}
.hit{position:absolute;left:calc(-1*var(--el,0px));right:calc(-1*var(--er,0px));z-index:3}
.hit.up{top:calc(-1*var(--et,0px));height:calc(50% + var(--et,0px))}
.hit.dn{bottom:calc(-1*var(--eb,0px));height:calc(50% + var(--eb,0px))}
.hit::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .25s}
.hit.flash::after{opacity:.18;transition:none}
#ctrl{position:fixed;z-index:20;display:flex;gap:6px;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right))}
#ctrl button{width:40px;height:40px;border-radius:20px;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:20px;opacity:.45;display:flex;align-items:center;justify-content:center}
#ctrl button:active{opacity:.9}
#ctrl.left{right:auto;left:max(8px,env(safe-area-inset-left))}
#ctrl .mode{display:flex;height:40px;border-radius:20px;overflow:hidden;background:rgba(0,0,0,.4)}
#ctrl .mode button{width:auto;height:40px;border-radius:0;background:none;padding:0 11px;font-size:14px;font-weight:700;opacity:.45}
#ctrl .mode button.on{background:rgba(255,255,255,.22);opacity:1}
.rh{display:flex;align-items:center;justify-content:center;color:#8a8a90;font-weight:700;white-space:nowrap;overflow:hidden;min-width:0}
.rcell{position:relative;display:flex;min-width:0;min-height:0;border-radius:6px;overflow:hidden}
.rcell .digits{flex:1;padding:0}
.rtot{position:relative;display:flex;align-items:center;justify-content:flex-end;border-radius:6px;overflow:hidden;min-width:0;min-height:0;line-height:1;font-variant-numeric:tabular-nums lining-nums}
.rtot .rname{position:absolute;left:.5em;top:.35em;font-weight:700;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92%;line-height:1.1}
.rtot .rval{white-space:nowrap}
.box .sec{margin-top:16px;color:#7fb2ff;font-size:13px;font-weight:700}
.box .rng{color:#888;font-size:13px}
/* settings */
#sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px}
#sheet.open{display:flex}
.box{background:#1c1c1f;color:#eee;border-radius:16px;width:min(640px,100%);max-height:100%;overflow:auto;padding:18px 20px 22px;-webkit-user-select:text;user-select:text;font-size:16px}
.box h2{font-size:18px;margin-bottom:12px;display:flex;align-items:center}
.box h2 button{margin-left:auto}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #2c2c30;flex-wrap:wrap}
.row>label{min-width:96px;color:#aaa;font-size:14px}
.step{display:flex;align-items:center;gap:6px}
.step b{min-width:28px;text-align:center;font-size:18px}
.box button{background:#33333a;color:#eee;border:0;border-radius:10px;padding:9px 14px;font-size:16px}
.box button.sq{width:40px;height:40px;padding:0;font-size:22px}
.box button.warn{background:#5a2323}
.box select,.box input[type=text],.box input[type=number]{background:#2a2a2e;color:#eee;border:1px solid #3a3a40;border-radius:8px;padding:8px 10px;font-size:16px}
.box input[type=text]{flex:1;min-width:120px}
.box input[type=number]{width:110px}
.box input[type=color]{width:46px;height:40px;border:0;border-radius:8px;background:none;padding:0}
.prow{display:flex;align-items:center;gap:8px;padding:7px 0}
.sw{display:flex;gap:5px;flex-wrap:wrap}
.sw i{width:22px;height:22px;border-radius:6px;display:block;border:1px solid rgba(255,255,255,.25)}
.note{color:#888;font-size:13px;margin-top:12px;line-height:1.6}
.preview{flex-basis:100%;font-size:34px;padding:4px 0}
</style>
</head>

<div id="sheet"><div class="box" id="box"></div></div>

const PALETTE=['#d63a3a','#2f6fdb','#e8b21f','#2e9e55','#8a4fd1','#ec7a2c','#3fbfe8','#ee7fb4','#8c8c94','#7a4a2a','#f2f2f2','#1e1e22'];
const FONTS=[
 ['デジタル 7セグ（クラシック）','"DSEG7C",monospace'],
 ['デジタル 7セグ（モダン）','"DSEG7M",monospace'],
 ['ヒラギノ角ゴ','"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif'],
 ['ヒラギノ丸ゴ','"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif'],
 ['ヒラギノ明朝','"Hiragino Mincho ProN",serif'],
 ['Avenir Next','"Avenir Next",Avenir,sans-serif'],
 ['Helvetica Neue','"Helvetica Neue",Helvetica,Arial,sans-serif'],
 ['DIN Alternate','"DIN Alternate","DIN Condensed",sans-serif'],
 ['DIN Condensed','"DIN Condensed","DIN Alternate",sans-serif'],
 ['Futura','Futura,sans-serif'],
 ['Gill Sans','"Gill Sans",sans-serif'],
 ['Georgia','Georgia,serif'],
 ['Didot','Didot,serif'],
 ['Baskerville','Baskerville,serif'],
 ['American Typewriter','"American Typewriter",serif'],
 ['Courier New','"Courier New",monospace'],
 ['Menlo','Menlo,monospace'],
 ['Chalkboard SE','"Chalkboard SE",sans-serif'],
 ['Marker Felt','"Marker Felt",fantasy'],
 ['Noteworthy','Noteworthy,cursive'],
 ['Copperplate','Copperplate,serif'],
 ['カスタム（名前を入力）','custom']
];
const defPlayer=i=>({name:'プレイヤー'+(i+1),color:PALETTE[i%PALETTE.length],score:0,rounds:[]});
let st={digits:3,font:0,customFont:'',bold:true,lines:true,neg:true,scale:100,rows:null,cols:null,
  mode:'total',rounds:3,rdigits:2,subPct:30,negRed:false,subStyle:'num',subEmoji:'⭐',players:[defPlayer(0),defPlayer(1)]};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.players)){if(s.v!==2&&typeof s.font==='number')s.font+=2;st=Object.assign(st,s);}}catch(e){}
st.v=2;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const undo=[];
const board=document.getElementById('board');
let els=[],rEls=null;

function fontStack(){const f=FONTS[st.font]||FONTS[0];if(f[1]==='custom')return (st.customFont?'"'+st.customFont.replace(/"/g,'')+'",':'')+'-apple-system,sans-serif';return f[1];}
function rgb(hex){const h=hex.replace('#','');return [0,2,4].map(k=>parseInt(h.substr(k,2),16));}
/* 白っぽい背景か（相対輝度0.7超） */
function isLight(hex){const [r,g,b]=rgb(hex).map(x=>x/255);const L=x=>x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4);return .2126*L(r)+.7152*L(g)+.0722*L(b)>0.7;}
function textColor(hex){const [r,g,b]=rgb(hex).map(x=>x/255);
 const L=x=>x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4);const y=.2126*L(r)+.7152*L(g)+.0722*L(b);return y>.4?'#111':'#fff';}
/* ラウンド欄の色：プレイヤーカラーを白と50%で混ぜる（全色共通のルール） */
const TINT=0.5;
function tint(hex){const c=rgb(hex).map(x=>Math.round(x+(255-x)*TINT));return '#'+c.map(x=>x.toString(16).padStart(2,'0')).join('');}
/* 範囲（マイナスは最上位桁に表示するため負側は1桁少ない） */
const rangeOf=d=>({max:Math.pow(10,d)-1,min:st.neg?-(Math.pow(10,d-1)-1):0});
const maxVal=()=>rangeOf(st.digits).max, minVal=()=>rangeOf(st.digits).min;
const clampD=(v,d)=>{const r=rangeOf(d);return Math.max(r.min,Math.min(r.max,v));};
const clampV=v=>clampD(v,st.digits);
const isDigital=()=>/DSEG/.test(fontStack());
const minusChar=()=>isDigital()?'-':'−';
const plainFont='"Hiragino Sans",-apple-system,sans-serif';
function roundsOf(p){if(!Array.isArray(p.rounds))p.rounds=[];while(p.rounds.length<st.rounds)p.rounds.push(0);if(p.rounds.length>st.rounds)p.rounds.length=st.rounds;return p.rounds;}
const totalOf=p=>roundsOf(p).reduce((a,b)=>a+b,0);
/* 現在フォントの数字幅（em比）を実測 */
let ratio=0.6;
function measure(){try{const c=document.createElement('canvas').getContext('2d');
 c.font=(st.bold?'700 ':'400 ')+'100px '+fontStack();let w=0;for(const d of '0123456789')w=Math.max(w,c.measureText(d).width);
 ratio=Math.max(0.4,Math.min(1.1,w/100));}catch(e){ratio=0.6;}}

/* 桁ごとタップ式の数字列を作る */
function makeDigits(D,onTap){
 const dg=document.createElement('div');dg.className='digits';const cells=[];
 for(let k=D-1;k>=0;k--){
  const c=document.createElement('div');c.className='digit';
  const ch=document.createElement('span');ch.className='ch';ch.textContent='0';
  const up=document.createElement('div');up.className='hit up';
  const dn=document.createElement('div');dn.className='hit dn';
  const place=Math.pow(10,k);
  up.addEventListener('pointerdown',e=>{e.preventDefault();flash(up);onTap(place)});
  dn.addEventListener('pointerdown',e=>{e.preventDefault();flash(dn);onTap(-place)});
  c.append(ch,up,dn);dg.append(c);cells.push({c,ch});
 }
 return {dg,cells};
}
function paint(cells,value,el){
 if(el)el.classList.toggle('isneg',value<0);
 const D=cells.length,neg=value<0,v=Math.abs(value),s=String(v).padStart(D,'0');
 const firstSig=v===0?D-1:D-String(v).length;
 cells.forEach((o,k)=>{
  if(neg&&k===0){o.ch.textContent=minusChar();o.c.classList.remove('lead');}
  else{o.ch.textContent=s[k];o.c.classList.toggle('lead',k<firstSig);}
 });
}
/* タップ領域を、数字の上（下）にあるそのプレイヤーの領域全体まで広げる */
function extendHits(dg,box){
 const ds=dg.children;if(!ds.length)return;
 const cr=box.getBoundingClientRect(),f=ds[0].getBoundingClientRect(),l=ds[ds.length-1].getBoundingClientRect();
 dg.style.setProperty('--et',Math.max(0,f.top-cr.top)+'px');
 dg.style.setProperty('--eb',Math.max(0,cr.bottom-f.bottom)+'px');
 for(const d of ds){d.style.removeProperty('--el');d.style.removeProperty('--er');}
 ds[0].style.setProperty('--el',Math.max(0,f.left-cr.left)+'px');
 ds[ds.length-1].style.setProperty('--er',Math.max(0,cr.right-l.right)+'px');
}
function flash(el){el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),120);}

function build(){
 if(!['total','round','sub'].includes(st.mode))st.mode='total';
 board.innerHTML='';els=[];rEls=null;
 board.style.fontFamily=fontStack();
 board.style.fontWeight=st.bold?'700':'400';
 board.classList.toggle('lines',!!st.lines);
 board.classList.toggle('negred',!!st.negRed);
 document.querySelectorAll('#modeSw button').forEach(b=>b.classList.toggle('on',b.dataset.m===st.mode));
 document.getElementById('ctrl').classList.toggle('left',st.mode==='round');
 measure();
 if(st.mode==='round')buildRound();else buildTotal();
 try{document.fonts.load((st.bold?'700 ':'400 ')+'100px '+fontStack(),'0123456789-').then(()=>{measure();layout();});}catch(e){}
}

/* ===== 合計モード ===== */
function buildTotal(){
 board.style.gap='6px';
 st.players.forEach((p,i)=>{
  const pn=document.createElement('div');pn.className='panel';
  pn.style.background=p.color;pn.style.color=textColor(p.color);
  const nm=document.createElement('div');nm.className='name';
  const t=document.createElement('span');t.className='t';t.textContent=p.name;
  const dl=document.createElement('span');dl.className='delta';
  nm.append(t,dl);if(isDigital())nm.style.fontFamily=plainFont;
  const {dg,cells}=makeDigits(st.digits,d=>tap(i,d));
  dg.style.color='#fff';  /* 得点の数字は常に白 */
  dg.classList.add('shadownum');  /* 全色で影 */
  if(isLight(p.color))dg.classList.add('lightbg');
  pn.append(nm,dg);
  let sb=null,sv=null;
  if(st.mode==='sub'){
   sb=document.createElement('div');sb.className='sub';sb.style.color=p.color;
   sb.innerHTML='<span class="sm">−</span><span class="sv"></span><div class="se"></div><span class="sp">+</span>';
   sv=sb.querySelector('.sv');
   [['sl',-1],['sr',1]].forEach(([c,d])=>{const h=document.createElement('div');h.className='sh '+c;
    h.addEventListener('pointerdown',e=>{e.preventDefault();flash(h);subTap(i,d);});sb.append(h);});
   pn.append(sb);
  }
  board.append(pn);
  els.push({pn,nm,t,dl,dg,cells,sb,sv,se:sb?sb.querySelector('.se'):null,acc:0,timer:null});
 });
 layout();
 st.players.forEach((_,i)=>render(i));
}
function render(i){const e=els[i];if(!e)return;paint(e.cells,st.players[i].score,e.dg);
 if(e.sv){const v=st.players[i].sub||0;const t=(v<0?minusChar():'')+Math.abs(v);const ch=t.length!==e.sv.textContent.length;
  e.sv.textContent=t;e.sv.classList.toggle('isneg',v<0);
  const emo=st.subStyle==='emoji'&&v>=0;
  e.sv.style.display=emo?'none':'';e.se.style.display=emo?'':'none';
  if(emo)renderEmoji(e,v);else if(ch)sizePanel(i);}}
/* 絵文字表示：10個分・5個分は数字付きの大アイコン、残りは小アイコン（例 16 = [10]+[5]+1） */
function firstGrapheme(str){str=String(str||'').trim();if(!str)return '⭐';
 try{if(window.Intl&&Intl.Segmenter){for(const g of new Intl.Segmenter('ja',{granularity:'grapheme'}).segment(str))return g.segment;}}catch(e){}
 return Array.from(str)[0];}
const advCache={};
function emojiAdv(em){if(advCache[em])return advCache[em];let w=1.2;
 try{const sp=document.createElement('span');sp.className='ei';sp.style.cssText='position:absolute;visibility:hidden;font-size:100px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  sp.textContent=em;document.body.append(sp);w=Math.max(0.8,Math.min(2,sp.getBoundingClientRect().width/100));sp.remove();}catch(e){}
 return advCache[em]=w;}
function renderEmoji(e,v){
 const se=e.se;se.innerHTML='';if(!v)return;
 const r=e.sb.getBoundingClientRect();if(!r.height)return;
 const em=firstGrapheme(st.subEmoji);
 const tens=Math.floor(v/10),fives=Math.floor(v%10/5),ones=v%5,cnt=tens+fives+ones;
 const SM=0.6,GAP=0.12;
 const units=(tens+fives)+ones*SM+Math.max(0,cnt-1)*GAP;
 /* 大きさは個数によらず一定（19個＝[10][5]+4個 が入る大きさ）。それを超えて入りきらない時だけ縮める */
 const hm=e.sb.querySelector('.sm').getBoundingClientRect();
 const adv=emojiAdv(em),avail=r.width-2*(hm.right-r.left+r.height*0.08);
 const wOf=n=>((n.b)+n.s*SM)*adv+Math.max(0,n.b+n.s-1)*GAP;
 const CAP=wOf({b:2,s:4});
 let big=Math.max(6,Math.min(r.height*0.72,avail/CAP));
 const need=wOf({b:tens+fives,s:ones});
 if(need*big>avail)big=Math.max(6,avail/need);
 se.style.gap=(big*GAP)+'px';
 const add=label=>{const d=document.createElement('span');d.className='ei';d.textContent=em;
  d.style.fontSize=(label?big:big*SM)+'px';
  if(label){const b=document.createElement('b');b.textContent=label;b.style.fontSize=(big*0.42)+'px';d.append(b);}
  se.append(d);};
 for(let k=0;k<tens;k++)add('10');
 for(let k=0;k<fives;k++)add('5');
 for(let k=0;k<ones;k++)add('');
}
function subTap(i,d){
 const p=st.players[i];const v=p.sub||0;const nv=Math.max(st.neg?-999:0,Math.min(9999,v+d));
 if(nv===v)return;undo.push({i,r:-2,v});if(undo.length>300)undo.shift();p.sub=nv;save();render(i);}
function tap(i,d){
 const p=st.players[i];const nv=clampV(p.score+d);
 if(nv===p.score)return;
 undo.push({i,r:-1,v:p.score});if(undo.length>300)undo.shift();
 const real=nv-p.score;p.score=nv;save();render(i);showDelta(i,real);
}
function showDelta(i,d){
 const e=els[i];e.acc+=d;
 e.dl.textContent=(e.acc>0?'+':e.acc<0?'−':'±')+Math.abs(e.acc);
 e.dl.classList.add('show');clearTimeout(e.timer);
 e.timer=setTimeout(()=>{e.dl.classList.remove('show');e.acc=0;},1600);
}

/* ===== ラウンド合計モード ===== */
function buildRound(){
 board.style.gap='3px';
 const R=st.rounds;rEls={heads:[],rows:[]};
 for(let r=-1;r<R;r++){const h=document.createElement('div');h.className='rh';h.textContent=r<0?'':'R'+(r+1);
  if(isDigital())h.style.fontFamily=plainFont;board.append(h);rEls.heads.push(h);}
 st.players.forEach((p,i)=>{
  const rs=roundsOf(p);const tc=tint(p.color);const row={cells:[],tot:null,val:null};
  const tot=document.createElement('div');tot.className='rtot';
  tot.style.background=p.color;tot.style.color=textColor(p.color);
  const nm=document.createElement('span');nm.className='rname';nm.textContent=p.name;if(isDigital())nm.style.fontFamily=plainFont;
  const val=document.createElement('span');val.className='rval';val.style.color='#fff';  /* 合計の数字は常に白 */
  val.classList.add('shadownum');
  tot.append(nm,val);board.append(tot);row.tot=tot;row.nm=nm;row.val=val;
  rs.forEach((_,r)=>{
   const cell=document.createElement('div');cell.className='rcell';
   cell.style.background=tc;cell.style.color='#111';  /* ラウンド欄は背景が薄いので常に黒 */
   const d=makeDigits(st.rdigits,dv=>rtap(i,r,dv));cell.append(d.dg);board.append(cell);
   row.cells.push({cell,dg:d.dg,cells:d.cells});
  });
  rEls.rows.push(row);
 });
 layout();
 st.players.forEach((_,i)=>renderRow(i));
}
function renderRow(i){
 const row=rEls&&rEls.rows[i];if(!row)return;const p=st.players[i];
 roundsOf(p).forEach((v,r)=>paint(row.cells[r].cells,v,row.cells[r].dg));
 const t=totalOf(p);row.val.textContent=(t<0?minusChar():'')+Math.abs(t);row.val.classList.toggle('isneg',t<0);
 if(row.val.textContent.length>unitsT)layoutRound();
}
function rtap(i,r,d){
 const p=st.players[i],rs=roundsOf(p);const nv=clampD(rs[r]+d,st.rdigits);
 if(nv===rs[r])return;
 undo.push({i,r,v:rs[r]});if(undo.length>300)undo.shift();
 rs[r]=nv;save();renderRow(i);
}

/* ===== レイアウト ===== */
const GAP=6;
const nameH=ph=>Math.max(22,Math.min(64,ph*0.11));
const subFrac=()=>st.mode==='sub'?(st.subPct||30)/100:0;
function fitFont(pw,ph,units){const dh=(ph-nameH(ph))*(1-subFrac())-(subFrac()?pw*0.02:0);return Math.max(10,Math.min(dh*0.92,(pw*0.96)/units/(ratio*1.04)));}
let grid={c:1,r:1};
const sc=()=>(st.scale||100)/100;
function inner(){const cs=getComputedStyle(board);
 return {W:board.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),
         H:board.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)};}
function calcGrid(){
 const n=st.players.length;const {W,H}=inner();let best=null;
 if(st.rows&&st.cols&&st.rows*st.cols>=n)best={c:st.cols,r:st.rows};
 else{for(let c=1;c<=n;c++){const r=Math.ceil(n/c);const pw=(W-(c-1)*GAP)/c,ph=(H-(r-1)*GAP)/r;
  const f=fitFont(pw,ph,st.digits);if(!best||f>best.f+0.5)best={c,r,f};}}
 return best;
}
function layout(){
 if(!st.players.length)return;
 if(st.mode==='round')return layoutRound();
 grid=calcGrid();
 board.style.gridTemplateColumns=`repeat(${grid.c},1fr)`;
 board.style.gridTemplateRows=`repeat(${grid.r},1fr)`;
 els.forEach((_,i)=>sizePanel(i));
}
function sizePanel(i){
 const e=els[i];if(!e)return;const r=e.pn.getBoundingClientRect();
 const nh=nameH(r.height);
 e.nm.style.height=nh+'px';e.nm.style.fontSize=(nh*0.58)+'px';
 const s=sc();
 let mainH=r.height-nh;
 if(e.sb){const subH=(r.height-nh)*subFrac();e.sb.style.height=subH+'px';
  const chars=Math.max(e.sv.textContent.length,2)+1.4;
  e.sb.style.fontSize=Math.max(8,Math.min(subH*0.78,r.width*0.94/(chars*ratio*1.04)))+'px';
  e.sb.querySelectorAll('.sm,.sp').forEach(x=>x.style.fontSize=Math.max(12,Math.min(subH*0.3,26))+'px');
  mainH-=subH+r.width*0.02;
  const v=st.players[i].sub||0;if(st.subStyle==='emoji'&&v>=0)renderEmoji(e,v);}
 const padX=r.width*(0.02+(1-s)/2*0.96), padY=mainH*(1-s)/2;
 e.dg.style.padding=padY+'px '+padX+'px';
 e.dg.style.fontSize=fitFont(r.width,r.height,st.digits)*s+'px';
 extendHits(e.dg,e.pn);
}
const HEAD=44;
let unitsT=3;
/* ラウンド欄と合計欄は完全に同じ文字サイズ・同じ縦位置で表示 */
function layoutRound(){
 if(!rEls||!rEls.rows.length)return;
 const D=st.rdigits;
 unitsT=Math.max(D+1,...rEls.rows.map(r=>r.val.textContent.length));
 const cw=Math.round(document.getElementById('ctrl').getBoundingClientRect().width+12);
 board.style.gridTemplateColumns=`minmax(${cw}px,${(unitsT/D).toFixed(3)}fr) repeat(${st.rounds},1fr)`;
 board.style.gridTemplateRows=`${HEAD}px repeat(${st.players.length},1fr)`;
 rEls.heads.forEach(h=>h.style.fontSize=Math.min(22,HEAD*0.5)+'px');
 const r0=rEls.rows[0];
 const rc=r0.cells[0]?r0.cells[0].cell.getBoundingClientRect():null,tc=r0.tot.getBoundingClientRect();
 const h=tc.height;const nf=Math.max(9,Math.min(18,h*0.17)),top=nf*1.5;
 const k=ratio*1.04;
 let f=Math.min((h-top)*0.86,tc.width*0.9/unitsT/k);
 if(rc)f=Math.min(f,rc.width*0.84/D/k);
 f=Math.max(8,f*sc());
 const vpad=Math.max(0,(h-top-f)/2);
 rEls.rows.forEach(row=>{
  row.nm.style.fontSize=nf+'px';
  row.tot.style.paddingTop=top+'px';
  row.tot.style.paddingRight=Math.max(10,tc.width*0.08)+'px';
  row.val.style.fontSize=f+'px';
  row.cells.forEach(o=>{
   const w=o.cell.getBoundingClientRect().width;
   const px=Math.max(0,(w-D*f*k*1.08)/2);
   o.dg.style.padding=`${top+vpad}px ${px}px ${vpad}px`;
   o.dg.style.fontSize=f+'px';
   extendHits(o.dg,o.cell);
  });
 });
}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{measure();layout();});
addEventListener('resize',()=>requestAnimationFrame(layout));
addEventListener('orientationchange',()=>setTimeout(layout,300));

document.getElementById('undoBtn').addEventListener('click',()=>{
 const u=undo.pop();if(!u||!st.players[u.i])return;const p=st.players[u.i];
 if(u.r===-1)p.score=u.v;else if(u.r===-2)p.sub=u.v;else if(u.r<st.rounds)roundsOf(p)[u.r]=u.v;
 save();if(u.r<0&&st.mode!=='round')render(u.i);else if(u.r>=0&&st.mode==='round')renderRow(u.i);});
document.querySelectorAll('#modeSw button').forEach(b=>b.addEventListener('click',()=>{if(st.mode!==b.dataset.m){st.mode=b.dataset.m;save();build();}}));

/* keep screen awake */
let lock=null;
async function wake(){try{if('wakeLock' in navigator&&!lock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>lock=null);}}catch(e){}}
document.addEventListener('pointerdown',wake);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake();});

/* ===== 設定 ===== */
const sheet=document.getElementById('sheet'),box=document.getElementById('box');
document.getElementById('setBtn').addEventListener('click',()=>{drawSettings();sheet.classList.add('open');});
sheet.addEventListener('pointerdown',e=>{if(e.target===sheet)close();});
function close(){sheet.classList.remove('open');build();}
let resetArm=false;
function drawSettings(){
 const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const g=calcGrid();if(st.mode!=='round')grid=g;
 const rr=rangeOf(st.rdigits),isR=st.mode==='round',isS=st.mode==='sub';
 const step=(m,v,p)=>`<div class="step"><button class="sq" data-a="${m}">−</button><b>${v}</b><button class="sq" data-a="${p}">+</button></div>`;
 box.innerHTML=`
 <h2>設定<button id="sClose">閉じる</button></h2>
 <div class="row"><label>人数</label>${step('pm',st.players.length,'pp')}</div>
 <div class="sec">合計モード</div>
 <div class="row"><label>並び（縦×横）</label>${step('rm',g.r,'rp')}<span style="font-size:20px">×</span>${step('cm',g.c,'cp')}
  <button data-a="auto">${st.rows?'自動に戻す':'自動（現在）'}</button></div>
 <div class="row"><label>桁数</label>${step('dm',st.digits,'dp')}<span class="rng">範囲 ${minVal()} 〜 ${maxVal()}</span></div>
 <div class="sec">ラウンド合計モード</div>
 <div class="row"><label>ラウンド数</label>${step('nm',st.rounds,'np')}</div>
 <div class="row"><label>1ラウンドの桁数</label>${step('qm',st.rdigits,'qp')}<span class="rng">範囲 ${rr.min} 〜 ${rr.max}</span></div>
 <div class="sec">サブポイントモード</div>
 <div class="row"><label>サブポイントの大きさ</label><input type="range" id="sSub" min="10" max="60" step="5" value="${st.subPct||30}" style="flex:1;min-width:160px"><b id="sSubV" style="min-width:48px;text-align:right">${st.subPct||30}%</b></div>
 <div class="row"><label>表示方法</label><select id="sSubStyle"><option value="num"${st.subStyle!=='emoji'?' selected':''}>数字</option><option value="emoji"${st.subStyle==='emoji'?' selected':''}>絵文字の数</option></select>
  ${st.subStyle==='emoji'?`<span style="color:#aaa;font-size:14px">絵文字を入力：</span><input type="text" id="sEmoji" value="${esc(st.subEmoji||'⭐')}" placeholder="⭐" style="flex:0 0 72px;min-width:0;width:72px;font-size:24px;text-align:center;padding:4px">
  <span class="emo" style="flex-basis:100%"><span style="color:#888;font-size:13px">候補：</span>${['⭐','❤️','💀','🪙','🍎','🔥','💎','🍺','⚠️','🏆'].map(x=>`<i data-em="${x}">${x}</i>`).join('')}</span>
  <span class="rng" style="flex-basis:100%">5個で[5]、10個で[10]の大きいアイコンにまとめて表示（例：16個 → [10]+[5]+1）</span>`:''}</div>
 <div class="sec">表示</div>
 <div class="row"><label>フォント</label><select id="sFont">${FONTS.map((f,k)=>`<option value="${k}"${k==st.font?' selected':''}>${f[0]}</option>`).join('')}</select>
  <select id="sBold"><option value="1"${st.bold?' selected':''}>太字</option><option value="0"${!st.bold?' selected':''}>標準</option></select>
  ${FONTS[st.font]&&FONTS[st.font][1]==='custom'?`<input type="text" id="sCustom" placeholder="例: Optima" value="${esc(st.customFont)}">`:''}
  <div class="preview" id="sPrev">0123456789 プレイヤー</div></div>
 <div class="row"><label>数字の大きさ</label><input type="range" id="sScale" min="30" max="100" step="5" value="${st.scale||100}" style="flex:1;min-width:160px"><b id="sScaleV" style="min-width:48px;text-align:right">${st.scale||100}%</b></div>
 <div class="row"><label>その他</label>
  <label style="color:#eee;min-width:0"><input type="checkbox" id="sLines"${st.lines?' checked':''}> 区切り線</label>
  <label style="color:#eee;min-width:0"><input type="checkbox" id="sNeg"${st.neg?' checked':''}> マイナス得点を許可</label>
  <label style="color:#eee;min-width:0"><input type="checkbox" id="sNegRed"${st.negRed?' checked':''}> マイナスの数値は赤文字</label></div>
 <div style="margin-top:14px;color:#aaa;font-size:14px">プレイヤー（色・名前・合計モードの得点）</div>
 ${st.players.map((p,i)=>`
  <div class="prow"><input type="color" data-c="${i}" value="${p.color}"><input type="text" data-n="${i}" value="${esc(p.name)}"><input type="number" inputmode="numeric" data-s="${i}" value="${p.score}"></div>
  <div class="sw" style="margin:0 0 6px 54px">${PALETTE.map(c=>`<i data-pc="${i}" data-col="${c}" style="background:${c}"></i>`).join('')}</div>`).join('')}
 <div class="row" style="border:0;margin-top:8px"><button class="warn" id="sReset">${resetArm?'もう一度押すと0にします':(isR?'全ラウンドの得点を0にする':isS?'全員の得点とサブポイントを0にする':'全員の得点を0にする')}</button></div>
 <p class="note">数字の<b>上半分</b>をタップでその桁を＋、<b>下半分</b>で−（例：十の位の上＝+10）。右上で「合計／ラウンド／サブ」を切り替え。サブポイントは白い枠の左半分で−1、右半分で＋1、↶で直前の操作を取り消し。<br>ラウンド欄の色はプレイヤーカラーを白と50%で混ぜた色です。</p>`;
 const prev=box.querySelector('#sPrev');prev.style.fontFamily=fontStack();prev.style.fontWeight=st.bold?'700':'400';
 box.querySelector('#sClose').onclick=close;
 box.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
  const a=b.dataset.a;
  if(a==='pp'&&st.players.length<12)st.players.push(defPlayer(st.players.length));
  if(a==='pm'&&st.players.length>1)st.players.pop();
  if(a==='pp'||a==='pm'||a==='auto'){st.rows=null;st.cols=null;}
  const n=st.players.length;let r=g.r,c=g.c;
  if(a==='rp'&&r<n){r++;c=Math.ceil(n/r);} if(a==='rm'&&r>1){r--;c=Math.ceil(n/r);}
  if(a==='cp'&&c<n){c++;r=Math.ceil(n/c);} if(a==='cm'&&c>1){c--;r=Math.ceil(n/c);}
  if(/^[rc][pm]$/.test(a)){st.rows=r;st.cols=c;}
  if(a==='dp'&&st.digits<6)st.digits++;
  if(a==='dm'&&st.digits>1){st.digits--;st.players.forEach(p=>p.score=clampV(p.score));}
  if(a==='np'&&st.rounds<20)st.rounds++;
  if(a==='nm'&&st.rounds>1)st.rounds--;
  if(a==='qp'&&st.rdigits<4)st.rdigits++;
  if(a==='qm'&&st.rdigits>1){st.rdigits--;st.players.forEach(p=>{const rs=roundsOf(p);rs.forEach((v,k)=>rs[k]=clampD(v,st.rdigits));});}
  st.players.forEach(roundsOf);
  undo.length=0;save();build();drawSettings();});
 box.querySelector('#sFont').onchange=e=>{st.font=+e.target.value;save();drawSettings();};
 box.querySelector('#sBold').onchange=e=>{st.bold=e.target.value==='1';save();drawSettings();};
 const cu=box.querySelector('#sCustom');if(cu)cu.oninput=e=>{st.customFont=e.target.value;save();prev.style.fontFamily=fontStack();};
 box.querySelector('#sScale').oninput=e=>{st.scale=+e.target.value;box.querySelector('#sScaleV').textContent=st.scale+'%';save();layout();};
 box.querySelector('#sLines').onchange=e=>{st.lines=e.target.checked;save();};
 box.querySelector('#sNegRed').onchange=e=>{st.negRed=e.target.checked;save();board.classList.toggle('negred',st.negRed);};
 box.querySelector('#sSubStyle').onchange=e=>{st.subStyle=e.target.value;save();build();drawSettings();};
 const emI=box.querySelector('#sEmoji');if(emI)emI.oninput=e=>{st.subEmoji=firstGrapheme(e.target.value);save();build();};
 box.querySelectorAll('[data-em]').forEach(x=>x.onclick=()=>{st.subEmoji=x.dataset.em;save();build();drawSettings();});
 box.querySelector('#sSub').oninput=e=>{st.subPct=+e.target.value;box.querySelector('#sSubV').textContent=st.subPct+'%';save();layout();};
 box.querySelector('#sNeg').onchange=e=>{st.neg=e.target.checked;if(!st.neg)st.players.forEach(p=>{if(p.score<0)p.score=0;if(p.sub<0)p.sub=0;const rs=roundsOf(p);rs.forEach((v,k)=>{if(v<0)rs[k]=0;});});save();drawSettings();};
 box.querySelectorAll('[data-c]').forEach(x=>x.oninput=e=>{st.players[+x.dataset.c].color=e.target.value;save();});
 box.querySelectorAll('[data-pc]').forEach(x=>x.onclick=()=>{st.players[+x.dataset.pc].color=x.dataset.col;save();drawSettings();});
 box.querySelectorAll('[data-n]').forEach(x=>x.oninput=e=>{st.players[+x.dataset.n].name=e.target.value;save();});
 box.querySelectorAll('[data-s]').forEach(x=>x.onchange=e=>{let v=parseInt(e.target.value,10);if(isNaN(v))v=0;
  v=clampV(v);st.players[+x.dataset.s].score=v;e.target.value=v;save();});
 box.querySelector('#sReset').onclick=()=>{if(!resetArm){resetArm=true;drawSettings();setTimeout(()=>{if(resetArm){resetArm=false;if(sheet.classList.contains('open'))drawSettings();}},3000);return;}
  resetArm=false;if(isR)st.players.forEach(p=>{p.rounds=[];roundsOf(p);});else st.players.forEach(p=>{p.score=0;if(isS)p.sub=0;});undo.length=0;save();drawSettings();};
}
/* ダブルタップ・ピンチでの拡大を防止 */
let lastTouch=0;
document.addEventListener('touchend',e=>{const t=e.target;
 if(t&&t.closest&&t.closest('input,select,textarea'))return;
 const now=Date.now();if(now-lastTouch<350){e.preventDefault();if(t.click&&t.tagName==='BUTTON')t.click();}lastTouch=now;},{passive:false});
board.addEventListener('touchstart',e=>{e.preventDefault();},{passive:false});
['gesturestart','gesturechange','dblclick'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
build();
})();
</script>
</body>
</html>
